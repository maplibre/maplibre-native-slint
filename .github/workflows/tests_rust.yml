name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Protocol Buffers Compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            g++ \
            git \
            glslang-dev \
            glslang-tools \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libglfw3-dev \
            libgtk-3-dev \
            libicu-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            pkg-config \
            libssl-dev \
            libuv1-dev \
            libwebp-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            spirv-tools
      
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('experiments/rust/**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('experiments/rust/**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: experiments/rust/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('experiments/rust/**/Cargo.lock') }}
      
      - name: Build
        env:
          MLN_CMAKE_CXX_LAUNCHER: ccache
        run: cargo build --verbose
        working-directory: ./experiments/rust
      
      - name: Run tests
        env:
          MLN_CMAKE_CXX_LAUNCHER: ccache
        run: cargo test --verbose
        working-directory: ./experiments/rust
