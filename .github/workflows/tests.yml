name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The label, rather than the matrix values, so the existing
    # "Run Tests (Release)" and "Run Tests (Debug)" check names do not change.
    name: Run Tests (${{ matrix.label }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The runner ships the Vulkan loader but no ICD, so wgpu enumerates no
        # Vulkan adapter and settles on GL (llvmpipe). That is a real code path
        # and worth keeping, but it is only one of the two: with an ICD present
        # wgpu picks Vulkan and the GLES adapter is merely probed and dropped.
        # HostGLContextGuard has to hold in both cases, so cover both.
        include:
          - build_type: Release
            label: Release
            slug: release
            vulkan_icd: false
          - build_type: Debug
            label: Debug
            slug: debug
            vulkan_icd: false
          - build_type: Release
            label: Release, Vulkan
            slug: release-vulkan
            vulkan_icd: true

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          cmake \
          curl \
          pkg-config \
          git \
          llvm-dev \
          libclang-dev \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libegl1-mesa-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          xvfb \
          libbrotli-dev \
          libcurl4-openssl-dev \
          libglfw3-dev \
          libidn2-dev \
          libjpeg-dev \
          libnghttp2-dev \
          libpng-dev \
          libpsl-dev \
          libssl-dev \
          libuv1-dev \
          libwebp-dev \
          libzstd-dev \
          libunistring-dev \
          libfontconfig1-dev \
          meson \
          zlib1g-dev \
          gcc \
          lcov \
          clang

    - name: Install a Vulkan ICD
      if: matrix.vulkan_icd
      run: sudo apt-get install -y mesa-vulkan-drivers

    - name: Report which rendering backend wgpu will pick
      run: |
        if ls /usr/share/vulkan/icd.d/*.json >/dev/null 2>&1; then
          echo "Vulkan ICDs present, wgpu will select Vulkan:"
          ls /usr/share/vulkan/icd.d
        else
          echo "No Vulkan ICD, wgpu will fall back to GL (llvmpipe)"
        fi

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.slug }}

    - name: Cache Submodules
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-submodules-${{ hashFiles('**/.gitmodules') }}
        restore-keys: |
          ${{ runner.os }}-submodules-
        
    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          build/_deps
        key: ${{ runner.os }}-build-${{ matrix.slug }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ matrix.slug }}-
          ${{ runner.os }}-build-
    
    - name: Configure CMake
      run: |
        export LIBCLANG_PATH="$(llvm-config --libdir)"
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    
    - name: Build
      run: |
        cd build
        cmake --build . --parallel $(nproc)
    
    - name: Run tests with Xvfb
      run: |
        cd build
        xvfb-run -a -s "-screen 0 1024x768x24 -ac +extension GLX +render -noreset" \
          ctest --output-on-failure --parallel $(nproc)
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.slug }}
        path: |
          build/Testing/Temporary/LastTest.log
          build/Testing/Temporary/LastTestsFailed.log
        retention-days: 5
